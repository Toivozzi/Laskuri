
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laskuri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toivo">Laskuri</div>

    <main class="laskuri">
        <h1>Laskuri 1.3.1</h1>
        <form id="lomake">
            <input id="lasku" type="text" placeholder="Esim. 6:7?" autocomplete="off" required>
            <button type="submit">Laske</button>
        </form>
        <p id="vastaus"></p>

        <div id="pyoristys" hidden>
            <label for="tarkkuus">Pyöristettynä:</label>
            <select id="tarkkuus">
                <option value="0">0 desimaalia :D</option>
                <option value="1">1 desimaali xD</option>
                <option value="2" selected>2 desimaalia :)</option>
                <option value="3">3 desimaalia :O</option>
                <option value="4">4 desimaalia :X</option>
                <option value="5">5 desimaalia :Z</option>
                <option value="6">6 desimaalia :D</option>
                <option value="7">7 desimaalia</option>
                <option value="8">8 desimaalia</option>
                <option value="9">9 desimaalia</option>
                <option value="10">10 desimaalia</option>
            </select>
            <p id="pyoristetty"></p>
        </div>
    </main>

    <script>
        const lomake = document.getElementById("lomake");
        const lasku = document.getElementById("lasku");
        const vastaus = document.getElementById("vastaus");
        const pyoristys = document.getElementById("pyoristys");
        const tarkkuus = document.getElementById("tarkkuus");
        const pyoristetty = document.getElementById("pyoristetty");

        let tulos = null;

        function naytaPyoristetty() {
            const desimaalit = Number(tarkkuus.value);
            pyoristetty.textContent = tulos.toLocaleString("fi-FI", {
                minimumFractionDigits: desimaalit,
                maximumFractionDigits: desimaalit
            });
        }

        function laske(s) {
            s = s.replace(/:/g, "/").replace(/\s/g, "");
            const t = s.match(/\d+(?:\.\d+)?|[()+\-*/^]/g);

            if (!t || t.join("") !== s) {
                throw Error("Virheellinen lasku");
            }

            let i = 0;

            function atom() {
                const x = t[i++];

                if (x === "+") return atom();
                if (x === "-") return -atom();

                if (x === "(") {
                    const n = summa();
                    if (t[i++] !== ")") throw Error("Sulkeet eivät täsmää");
                    return n;
                }

                if (!x || !/^\d+(?:\.\d+)?$/.test(x)) {
                    throw Error("Virheellinen lasku");
                }

                return Number(x);
            }

            function potenssi() {
                const a = atom();
                return t[i] === "^" ? (i++, a ** potenssi()) : a;
            }

            function tulo() {
                let a = potenssi();

                while (t[i] === "*" || t[i] === "/") {
                    const op = t[i++];
                    const b = potenssi();

                    if (op === "/" && b === 0) {
                        throw Error("Nollalla ei voi jakaa :DDDD");
                    }

                    a = op === "*" ? a * b : a / b;
                }

                return a;
            }

            function summa() {
                let a = tulo();

                while (t[i] === "+" || t[i] === "-") {
                    const op = t[i++];
                    const b = tulo();
                    a = op === "+" ? a + b : a - b;
                }

                return a;
            }

            const n = summa();

            if (i !== t.length || !Number.isFinite(n)) {
                throw Error("Virheellinen lasku!!!");
            }

            return n;
        }

        lomake.addEventListener("submit", function(e) {
            e.preventDefault();

            try {
                tulos = laske(lasku.value);

                vastaus.textContent = "Vastaus: " +
                    tulos.toLocaleString("fi-FI", {
                        maximumFractionDigits: 10
                    });

                pyoristys.hidden = false;
                naytaPyoristetty();
            } catch (e) {
                vastaus.textContent = e.message;
                pyoristys.hidden = true;
            }
        });

        tarkkuus.addEventListener("change", naytaPyoristetty);
    </script>
</body>
</html>
